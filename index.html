  <style>
    /* Palette centralisée : modifier ces variables suffit à adapter l'identité visuelle. */
    :root{--ink:#172033;--muted:#64748b;--paper:#fff;--bg:#f5f7ff;--violet:#635bff;--violet2:#8b5cf6;--mint:#0fba8a;--red:#e8566f;--gold:#f4a62a;--line:#e6e9f3;--shadow:0 18px 45px rgba(41,37,86,.12)}
    /* Thème sombre activé par le bouton : seules les variables changent. */
    body.dark{--ink:#edf1ff;--muted:#b4bdd1;--paper:#192238;--bg:#0d1322;--line:#2b3854;--shadow:0 18px 45px rgba(0,0,0,.32)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 5% 0,#e6e4ff 0,transparent 31rem),radial-gradient(circle at 100% 100%,#d9faf0 0,transparent 28rem),var(--bg)}
    button{font:inherit;cursor:pointer}.shell{width:min(920px,calc(100% - 32px));margin:auto;padding:36px 0 48px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:26px}.top-tools{display:flex;align-items:center;gap:9px}.brand{display:flex;gap:12px;align-items:center}.brand-mark{width:45px;height:45px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,var(--violet),var(--violet2));box-shadow:0 9px 18px #635bff4d;color:white;font-size:23px}.brand h1{font-size:1.05rem;margin:0;letter-spacing:-.02em}.brand p{margin:0;color:var(--muted);font-size:.84rem}.score-pill{background:var(--paper);padding:8px 13px;border:1px solid var(--line);border-radius:999px;font-weight:750;font-size:.9rem;box-shadow:0 5px 14px #1e1b4b0b}.score-pill span{color:var(--violet)}.theme-toggle{border:1px solid var(--line);background:var(--paper);color:var(--ink);width:39px;height:39px;border-radius:50%;font-size:1.05rem;transition:.2s}.theme-toggle:hover{transform:rotate(16deg);border-color:#aaa5ff}
    .card{overflow:hidden;background:var(--paper);border:1px solid #edf0f6;border-radius:25px;box-shadow:var(--shadow)}.progress-zone{padding:21px 28px 17px;border-bottom:1px solid var(--line)}.progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;font-weight:700;margin-bottom:9px}.progress{height:10px;border-radius:99px;background:#eef0fb;overflow:hidden}.progress>i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--violet),#a855f7);transition:width .55s cubic-bezier(.2,.9,.2,1)}
    .question{padding:33px 28px 30px;animation:arrive .38s ease both}.tag{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:99px;background:#f0efff;color:#574ce1;font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.question h2{max-width:750px;margin:17px 0 23px;font-size:clamp(1.22rem,3vw,1.65rem);line-height:1.34;letter-spacing:-.025em}.answers{display:grid;gap:11px}.answer{position:relative;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:15px;background:var(--paper);padding:15px 47px 15px 17px;color:var(--ink);font-weight:650;transition:.18s ease}.answer:hover:not(:disabled){border-color:#aaa5ff;transform:translateY(-2px);box-shadow:0 8px 18px #4438a71a}.answer::after{position:absolute;right:16px;top:50%;translate:0 -50%;font-size:1.12rem}.answer.correct{background:#ecfcf6;border-color:#43cba1;color:#087653}.answer.correct::after{content:'✓'}.answer.wrong{background:#fff1f3;border-color:#fa9aaa;color:#b52345}.answer.wrong::after{content:'×'}.answer:disabled{cursor:default}.feedback{display:none;margin-top:22px;padding:17px 18px;border-radius:16px;background:color-mix(in srgb,var(--paper) 88%,#eeeaff);border-left:4px solid var(--violet);animation:arrive .3s ease}.feedback.show{display:block}.feedback strong{color:#796fff}.feedback p{margin:6px 0 0}.feedback .rule{color:var(--muted)}.feedback .example{color:#0b9d72;font-style:italic}.actions{display:flex;justify-content:flex-end;margin-top:23px}.next{border:0;border-radius:13px;padding:12px 19px;color:#fff;background:linear-gradient(135deg,var(--violet),#7c3aed);font-weight:800;box-shadow:0 9px 17px #635bff42;transition:.2s}.next:hover{transform:translateY(-2px);filter:brightness(1.06)}.next:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .result{display:none;text-align:center;padding:41px 28px}.result.show{display:block;animation:arrive .45s ease}.badge{width:88px;height:88px;display:grid;place-items:center;margin:0 auto 16px;border-radius:50%;font-size:42px;background:linear-gradient(135deg,#fff5ca,#ffd770);box-shadow:0 12px 25px #e7a82040}.result h2{margin:0;font-size:1.8rem}.result .percent{margin:8px 0;font-size:3rem;line-height:1;font-weight:900;color:var(--violet);letter-spacing:-.06em}.result .level{font-weight:800;color:#18a77c}.advice{max-width:600px;margin:19px auto 24px;padding:14px 17px;border-radius:14px;background:color-mix(in srgb,var(--paper) 88%,#eeeaff);color:var(--ink)}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.restart,.share{border:0;border-radius:13px;padding:13px 20px;font-weight:800}.restart{background:var(--ink);color:var(--paper)}.share{background:#e9e7ff;color:#4b43cb}.confetti{position:fixed;top:-15px;width:10px;height:16px;border-radius:3px;pointer-events:none;z-index:10;animation:fall 2.5s linear forwards}
    @keyframes arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}@keyframes fall{to{transform:translate(var(--drift),105vh) rotate(720deg);opacity:0}}@media(max-width:560px){.shell{width:min(100% - 20px,920px);padding-top:20px}.top{align-items:flex-start}.score-pill{white-space:nowrap}.progress-zone{padding:17px 18px}.question{padding:25px 18px}.question h2{font-size:1.2rem}.answer{padding:13px 42px 13px 14px}.result{padding:32px 18px}}
  </style>

<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="brand-mark">✦</div><div><h1>Atelier des verbes</h1><p>Entraînement B2 · TCF · TEF · DELF/DALF</p></div></div><div class="top-tools"><button class="theme-toggle" id="themeToggle" type="button" aria-label="Activer le mode sombre" title="Mode sombre">🌙</button><div class="score-pill">Score : <span id="score">0</span>/20</div></div></header>
    <section class="card" aria-live="polite">
      <div id="quiz"><div class="progress-zone"><div class="progress-meta"><span id="counter">Question 1 sur 20</span><span id="progressText">0 %</span></div><div class="progress"><i id="bar"></i></div></div><div class="question" id="question"></div></div>
      <div class="result" id="result"></div>
    </section>
  </main>
  <script>
  /* Banque de questions B2. Format : catégorie, consigne, 4 réponses, index correct,
     explication, règle, exemple. Chaque entrée reste indépendante pour faciliter les modifications. */
  const bank = [
    ['Indicatif','Quand tu ___, appelle-moi.', 'arriveras','arrives','arriverais','arrivais',0,'Le futur simple exprime une action à venir après « quand ».','Après quand (valeur future), on emploie le futur simple.','Quand tu auras fini, nous partirons.'],
    ['Subjonctif','Il faut que vous ___ ce dossier avant midi.', 'finissiez','finissez','finirez','finiriez',0,'Après « il faut que », le subjonctif est requis.','Les expressions de nécessité introduisent le subjonctif.','Il faut qu’elle soit prête.'],
    ['Conditionnel','À votre place, je ___ cette proposition.', 'accepterais','accepterai','acceptais','accepte',0,'Le conditionnel présent sert à donner un conseil.', 'À votre place + conditionnel présent = conseil.', 'Je demanderais davantage d’informations.'],
    ['Temps composés','Dès qu’il ___ son travail, il est sorti.', 'a terminé','terminait','terminera','avait terminé',0,'Le passé composé marque ici une action achevée et ponctuelle.', 'Le passé composé présente un fait terminé.', 'Elle a fermé la porte puis est partie.'],
    ['Participe passé','Les lettres que j’ai ___ hier sont sur la table.', 'écrites','écrit','écrite','écrits',0,'Le COD « que » est placé avant le verbe : le participe s’accorde avec « lettres ».','Avec avoir, accord si le COD est placé avant.','Les photos qu’il a prises sont réussies.'],
    ['Pronominaux','Elles se sont ___ compte de leur erreur.', 'rendu','rendues','rendre','rendus',0,'« Se rendre compte » contient un COD (« compte ») après le verbe : pas d’accord.', 'Un participe pronominal ne s’accorde pas si le COD suit.', 'Ils se sont lavé les mains.'],
    ['Irréguliers','Bien qu’il ___ très fatigué, il a continué.', 'soit','est','sera','serait',0,'« Bien que » est suivi du subjonctif ; « être » donne « soit ».','Bien que + subjonctif.', 'Bien qu’il pleuve, ils sortent.'],
    ['Choix du temps','Pendant que je ___, le téléphone a sonné.', 'travaillais','ai travaillé','travaillerai','aurais travaillé',0,'L’imparfait décrit l’action en cours interrompue par un événement.', 'Imparfait pour le décor ou une action en cours.', 'Je lisais quand il est arrivé.'],
    ['Subjonctif','Je doute qu’ils ___ à temps.', 'puissent venir','peuvent venir','pourront venir','pourraient venir',0,'Le doute appelle généralement le subjonctif.', 'Douter que + subjonctif.', 'Je doute qu’elle connaisse la réponse.'],
    ['Plus-que-parfait','Quand nous sommes arrivés, le film ___.', 'avait déjà commencé','a déjà commencé','commençait déjà','commencera déjà',0,'Le plus-que-parfait situe une action avant un autre moment passé.', 'Plus-que-parfait = antériorité dans le passé.', 'Il avait quitté les lieux avant la police.'],
    ['Futur antérieur','Quand vous ___ ce livre, vous me le prêterez ?', 'aurez lu','lirez','aviez lu','auriez lu',0,'L’action de lire sera achevée avant le prêt futur.', 'Futur antérieur pour une action achevée avant un futur.', 'Dès qu’elle aura répondu, nous déciderons.'],
    ['Conditionnel passé','Sans votre aide, nous n’___ jamais ce projet.', 'aurions réussi','avons réussi','réussirons','réussissions',0,'Le conditionnel passé évoque ici une conséquence non réalisée.', 'Si + plus-que-parfait → conditionnel passé.', 'Sans toi, je n’aurais pas compris.'],
    ['Indicatif','Je pense qu’elle ___ raison.', 'a','ait','aurait','avait eu',0,'Après une affirmation comme « je pense que », on utilise normalement l’indicatif.', 'Opinion affirmative : indicatif en général.', 'Je crois qu’il viendra.'],
    ['Subjonctif','Je ne pense pas qu’il ___ disponible.', 'soit','est','sera','serait',0,'La négation de « penser » entraîne souvent le subjonctif.', 'Opinion niée : subjonctif fréquent.', 'Je ne crois pas qu’elle puisse venir.'],
    ['Participe passé','Ils se sont ___ pendant deux heures.', 'parlé','parlés','parlées','parler',0,'« Parler à quelqu’un » : le pronom est COI, donc pas d’accord.', 'Pas d’accord quand le pronom est COI.', 'Elles se sont téléphoné hier.'],
    ['Participe passé','Marie est ___ très tôt ce matin.', 'partie','parti','parties','partir',0,'Avec être, le participe s’accorde avec le sujet « Marie ».','Avec être, accord avec le sujet.','Mes amies sont arrivées.'],
    ['Conditionnel','Si j’avais plus de temps, je ___ un instrument.', 'apprendrais','apprendrai','apprenais','aurais appris',0,'La structure irréelle au présent est : si + imparfait, conditionnel présent.','Si + imparfait → conditionnel présent.','Si j’étais riche, je voyagerais.'],
    ['Conditionnel','Si tu m’avais prévenu, je ___ plus tôt.', 'serais venu','viendrais','viens','étais venu',0,'La condition passée non réalisée demande le conditionnel passé.','Si + plus-que-parfait → conditionnel passé.','Si tu avais insisté, j’aurais accepté.'],
    ['Concordance','Il m’a dit qu’il ___ le lendemain.', 'viendrait','viendra','venait','est venu',0,'Au discours indirect au passé, le futur devient conditionnel présent.', 'Futur → conditionnel au discours indirect passé.', 'Elle a promis qu’elle téléphonerait.'],
    ['Impératif','___-moi ce que vous en pensez.', 'Dites','Disiez','Direz','Dis',0,'À « vous », l’impératif de dire est « dites ».','L’impératif exprime un ordre, un conseil ou une invitation.','Prenez votre temps.'],
    ['Passé composé','Nous ___ à Paris l’été dernier.', 'sommes allés','avons allé','allions','serions allés',0,'« Aller » se conjugue avec être au passé composé.', 'Les verbes de mouvement courants utilisent être.', 'Ils sont revenus hier.'],
    ['Subjonctif','Quoiqu’elle ___, personne ne l’écoute.', 'dise','dit','dira','disait',0,'« Quoique » introduit le subjonctif.', 'Quoique + subjonctif.', 'Quoi qu’il fasse, je le soutiens.'],
    ['Temps','Depuis deux ans, ils ___ dans cette ville.', 'habitent','ont habité','habitaient','habiteront',0,'Le présent convient à une situation commencée dans le passé et toujours vraie.', 'Depuis + durée + présent pour une situation actuelle.', 'Je travaille ici depuis 2022.'],
    ['Temps','Il y a trois ans, ils ___ encore ici.', 'habitaient','habitent','ont habité toujours','habiteront',0,'L’imparfait décrit une situation durable dans le passé.', 'Imparfait pour une habitude ou une situation passée.', 'À cette époque, je vivais à Lyon.'],
    ['Verbe irrégulier','Je veux que tu ___ honnête avec moi.', 'sois','es','seras','serais',0,'Le subjonctif de « être » à « tu » est « sois ».','Être au subjonctif : que je sois, que tu sois.','Il faut que nous soyons prudents.'],
    ['Verbe irrégulier','Il est indispensable que nous ___ une décision.', 'prenions','prenons','prendrons','prendrions',0,'« Prendre » au subjonctif présent : que nous prenions.', 'Après une expression d’obligation : subjonctif.', 'Il faut que vous preniez le train.'],
    ['Futur','Dans dix ans, la technologie ___ encore.', 'aura évolué','évoluait','avait évolué','évoluerait',0,'Le futur antérieur imagine un bilan achevé à un moment futur.', 'Futur antérieur : action achevée dans l’avenir.', 'En 2030, il aura terminé ses études.'],
    ['Participe passé','La décision qu’ils ont ___ est définitive.', 'prise','pris','prennent','prendre',0,'« Décision » est COD féminin singulier placé avant : « prise ».','Accord avec avoir si le COD précède.', 'La robe qu’elle a choisie est rouge.'],
    ['Pronominaux','Elles se sont ___ à la réunion.', 'inscrites','inscrit','inscrire','inscrits',0,'Ici « se » est COD et le sujet féminin pluriel impose l’accord.', 'Avec un pronominal, accord si « se » est COD.', 'Ils se sont rencontrés hier.'],
    ['Pronominaux','Ils se sont ___ les mains avant le repas.', 'lavé','lavés','lavées','laver',0,'Le COD « les mains » suit le verbe ; « se » est COI.', 'Pas d’accord lorsque le COD est après.', 'Elle s’est brossé les cheveux.'],
    ['Subjonctif','Avant que vous ne ___, fermez la fenêtre.', 'partiez','partez','partirez','partiriez',0,'« Avant que » est suivi du subjonctif ; le « ne » est explétif.', 'Avant que + subjonctif.', 'Avant qu’il ne soit trop tard, agissez.'],
    ['Indicatif','Après qu’il ___, nous commencerons.', 'sera arrivé','soit arrivé','arrive','arrivait',0,'« Après que » est suivi de l’indicatif, ici le futur antérieur.', 'Après que + indicatif.', 'Après qu’elle aura mangé, elle sortira.'],
    ['Subjonctif','Je cherche quelqu’un qui ___ parler arabe.', 'sache','sait','saura','savait',0,'Une personne recherchée mais non identifiée appelle le subjonctif.', 'Antécédent indéfini ou recherché : subjonctif.', 'Je veux un livre qui soit clair.'],
    ['Indicatif','Je connais quelqu’un qui ___ parler arabe.', 'sait','sache','saura','saurait',0,'Une personne réelle et identifiée appelle l’indicatif.', 'Antécédent défini et réel : indicatif.', 'J’ai un ami qui habite ici.'],
    ['Conditionnel','Le journal annonce que le ministre ___ demain.', 'viendrait','viendra','venait','soit venu',0,'Le conditionnel peut marquer une information non confirmée.', 'Conditionnel journalistique : information rapportée avec prudence.', 'Le président serait en déplacement.'],
    ['Passif','Le pont ___ par une entreprise locale en 2018.', 'a été construit','est construit','avait construit','a construit',0,'La voix passive se forme avec être + participe passé.', 'Passif : être + participe passé, accord avec le sujet.', 'La lettre a été envoyée hier.'],
    ['Gérondif','___ régulièrement, vous progresserez vite.', 'En révisant','Révisez','Révisant','Ayant révisé',0,'Le gérondif « en + participe présent » exprime le moyen.', 'En + participe présent = simultanéité ou moyen.', 'En pratiquant, on apprend.'],
    ['Infinitif passé','Après ___ son travail, elle est sortie.', 'avoir terminé','terminer','ayant terminé','être terminée',0,'L’infinitif passé marque une action antérieure au verbe principal.', 'Après + infinitif passé pour l’antériorité.', 'Après avoir mangé, il est parti.'],
    ['Subjonctif','Pourvu qu’il ne ___ pas !', 'pleuve','pleut','pleuvra','pleuvait',0,'« Pourvu que » exprime un souhait et exige le subjonctif.', 'Pourvu que + subjonctif.', 'Pourvu que tout se passe bien !'],
    ['Imparfait','Chaque dimanche, nous ___ chez nos grands-parents.', 'allions','sommes allés','irons','serions allés',0,'Une habitude passée se formule à l’imparfait.', 'Imparfait pour les répétitions passées.', 'Tous les étés, elle lisait beaucoup.'],
    ['Passé simple','Dans ce récit, soudain le héros ___.', 'apparut','apparaissait','est apparu','apparaîtra',0,'Le passé simple est fréquent dans les récits écrits pour une action ponctuelle.', 'Passé simple : action brève dans un récit écrit.', 'Il ouvrit la porte et entra.'],
    ['Futur','Ne t’inquiète pas, je ___ demain.', 't’appellerai','t’appelais','t’appellerais','t’ai appelé',0,'Le futur simple annonce une action future certaine.', 'Futur simple pour une projection dans l’avenir.', 'Nous partirons vendredi.'],
    ['Conditionnel','J’aimerais que vous me ___ votre avis.', 'donniez','donnez','donnerez','donneriez',0,'« J’aimerais que » est suivi du subjonctif.', 'Volonté ou souhait + que : subjonctif.', 'Je voudrais qu’il vienne.'],
    ['Subjonctif passé','Je suis ravi que tu ___ à cette invitation.', 'aies répondu','as répondu','répondes','avais répondu',0,'Le subjonctif passé marque une action déjà accomplie.', 'Subjonctif passé : auxiliaire au subjonctif + participe.', 'Je regrette qu’elle soit partie.'],
    ['Plus-que-parfait','Il était déçu parce qu’il ___ son train.', 'avait raté','a raté','ratait','ratera',0,'Le train manqué est antérieur à sa déception passée.', 'Plus-que-parfait : fait passé antérieur.', 'Elle avait oublié ses clés.'],
    ['Participe passé','Les enfants que nous avons ___ jouer sont nos voisins.', 'vus','vu','vues','voir',0,'Avec un infinitif, accord si le COD antéposé fait l’action de l’infinitif : les enfants jouent.', 'Avec voir + infinitif, accord si le COD fait l’action.', 'Les chanteuses que j’ai entendues chanter.'],
    ['Participe passé','Les chansons que nous avons ___ chanter sont connues.', 'entendu','entendues','entendus','entendre',0,'Les chansons ne chantent pas : elles sont entendues ; pas d’accord.', 'Pas d’accord si le COD subit l’action de l’infinitif.', 'Les pièces que j’ai vu jouer.'],
    ['Pronoms','Je ne sais pas ce qu’il ___ faire.', 'va','vienne','allait','irait',0,'Le futur proche se forme avec aller au présent + infinitif.', 'Aller + infinitif : futur proche.', 'Nous allons déménager bientôt.'],
    ['Négation','Personne ne ___ ce qui s’est passé.', 'sait','sache','sauraient','avait su',0,'« Personne » est singulier : le verbe reste au singulier.', 'Personne, chacun, tout le monde : singulier.', 'Tout le monde est prêt.'],
    ['Subjonctif','C’est le meilleur film que je ___ jamais vu.', 'aie','ai','aurai','avais',0,'Après un superlatif, le subjonctif est habituel.', 'Superlatif + que : subjonctif fréquent.', 'C’est la plus belle ville que je connaisse.'],
    ['Accord','Combien d’erreurs avez-vous ___ ?', 'faites','fait','faire','faits',0,'Dans « faire des erreurs », le COD « combien d’erreurs » précède et impose l’accord.', 'Avec avoir, accord avec le COD antéposé.', 'Les fautes qu’elle a faites sont rares.'],
    ['Conditionnel','Il faudrait que nous ___ plus attentifs.', 'soyons','sommes','serons','serions',0,'« Il faudrait que » exprime une nécessité et introduit le subjonctif.', 'Conditionnel impersonnel + que : subjonctif.', 'Il vaudrait mieux que tu partes.'],
    ['Impératif','___ attention à la marche !', 'Fais','Fait','Faites-tu','Faisons-tu',0,'À « tu », l’impératif de faire est « fais ».','Impératif de faire : fais, faisons, faites.','Fais tes devoirs.'],
    ['Imparfait','Si je ___ vous, je refuserais.', 'étais','serais','suis','avais été',0,'Après si, on emploie l’imparfait dans cette hypothèse présente.', 'On ne met pas le conditionnel juste après si.', 'Si j’avais de l’argent, je partirais.'],
    ['Futur','S’il fait beau, nous ___ à la plage.', 'irons','allions','irions','sommes allés',0,'Une condition réelle : si + présent, futur simple.', 'Si + présent → futur simple.', 'Si tu viens, nous sortirons.'],
    ['Subjonctif','Je resterai jusqu’à ce que tu ___.', 'reviennes','reviens','reviendras','revenais',0,'« Jusqu’à ce que » exige le subjonctif.', 'Jusqu’à ce que + subjonctif.', 'Attends jusqu’à ce qu’il arrive.'],
    ['Temps composé','Elle ___ son passeport : elle ne le trouve plus.', 'a perdu','perdait','perdra','avait perdu',0,'Le passé composé exprime une action passée avec conséquence présente.', 'Passé composé : fait achevé lié au présent.', 'J’ai cassé mes lunettes.'],
    ['Indicatif','Il paraît que les prix ___.', 'augmentent','augmentent-ils','augmenteraient que','augmentassent',0,'« Il paraît que » introduit une information présentée comme un fait : indicatif.', 'Il paraît que + indicatif.', 'Il semble qu’il est absent (usage courant).'],
    ['Subjonctif','Je crains qu’elle ne ___ son avion.', 'rate','rate pas','ratera','ratait',0,'« Craindre que » est suivi du subjonctif, parfois avec ne explétif.', 'Crainte + que : subjonctif.', 'Je crains qu’il ne soit trop tard.'],
    ['Verbe irrégulier','Nous ___ nous lever tôt demain.', 'devrons','devions','devrions','avons dû',0,'Le futur simple de devoir est « nous devrons ».','Devoir : je devrai, nous devrons.','Tu devras patienter.'],
    ['Verbe irrégulier','Il faut que je ___ ce problème.', 'résolve','résous','résoudrai','résolvais',0,'Le subjonctif de résoudre est « que je résolve ».','Résoudre : que je résolve, que nous résolvions.','Il faut qu’ils résolvent ce conflit.'],
    ['Verbe irrégulier','Vous ___ déjà la réponse.', 'saviez','connaissiez','aviez su','seriez',0,'« Savoir » s’emploie pour une information ; l’imparfait est « saviez ».','Savoir un fait ; connaître une personne/chose.', 'Je savais qu’il viendrait.'],
    ['Participe passé','Elle s’est ___ de cette remarque.', 'souvenue','souvenu','souvenir','souvenés',0,'« Se souvenir » s’accorde avec le sujet : elle s’est souvenue.', 'Les pronominaux essentiellement pronominaux s’accordent.', 'Ils se sont souvenus de tout.'],
    ['Pronominaux','Ils se sont ___ au téléphone.', 'parlé','parlés','parlées','parler',0,'On parle à quelqu’un : « se » est COI, donc invariable.', 'COI après un pronominal : pas d’accord.', 'Elles se sont écrit.'],
    ['Concordance','Elle souhaite que nous ___ demain.', 'venions','viendrons','venions-nous','sommes venus',0,'« Souhaiter que » se construit avec le subjonctif.', 'Souhait + que : subjonctif.', 'Il souhaite que tu réussisses.'],
    ['Conditionnel passé','J’___ aimé vous rencontrer.', 'aurais','avais','ai','aurai',0,'Le conditionnel passé peut exprimer un regret ou une politesse atténuée.', 'Conditionnel passé pour un regret.', 'J’aurais préféré rester.'],
    ['Temps','Cela fait une heure qu’il ___.', 'pleut','a plu','pleuvait','pleuvra',0,'La situation a commencé il y a une heure et continue : présent.', 'Cela fait + durée + présent.', 'Ça fait dix minutes que j’attends.'],
    ['Subjonctif','Où que vous ___, restez prudent.', 'alliez','allez','irez','iriez',0,'« Où que » est suivi du subjonctif.', 'Où que, qui que, quoi que + subjonctif.', 'Qui que vous soyez, entrez.'],
    ['Infinitif','Il est difficile de ___ cette règle.', 'comprendre','comprenant','compris','comprenez',0,'Après « difficile de », on emploie l’infinitif.', 'Adjectif + de + infinitif.', 'C’est facile à retenir.'],
    ['Participe présent','___ son retard, il a couru jusqu’à la gare.', 'Sachant','Sait','Su','Ayant su',0,'Le participe présent exprime ici une cause simultanée.', 'Participe présent invariable en -ant.', 'Connaissant la ville, elle nous a guidés.'],
    ['Voix passive','Ces produits ___ en France.', 'sont fabriqués','ont fabriqué','fabriquent','se fabriqué',0,'Le sujet subit l’action : être + participe passé.', 'Au passif, le participe s’accorde avec le sujet.', 'Les maisons sont vendues rapidement.'],
    ['Discours indirect','Il demande : « Où habitez-vous ? » → Il demande où vous ___.', 'habitez','habitiez','habiterez','habiteriez',0,'Quand le verbe introducteur est au présent, le temps est conservé.', 'Discours indirect au présent : pas de changement de temps.', 'Elle demande quand tu pars.'],
    ['Discours indirect','Il a demandé : « Où habitez-vous ? » → Il a demandé où vous ___.', 'habitiez','habitez','habiterez','auriez habité',0,'Avec un verbe introducteur au passé, le présent devient imparfait.', 'Présent → imparfait au discours indirect passé.', 'Elle a demandé quand tu partais.'],
    ['Subjonctif','À moins qu’il ne ___, la sortie est maintenue.', 'pleuve','pleut','pleuvra','pleuvait',0,'« À moins que » introduit une exception au subjonctif.', 'À moins que + subjonctif.', 'Nous partirons, à moins qu’il ne neige.'],
    ['Indicatif','Parce qu’il ___ malade, il est resté chez lui.', 'était','soit','serait','sera',0,'« Parce que » exprime une cause présentée comme certaine : indicatif.', 'Parce que + indicatif.', 'Je pars parce que je suis fatigué.'],
    ['Subjonctif','Non pas qu’il ___ envie, mais il n’a pas le temps.', 'n’ait','n’a pas','n’aurait pas','n’avait pas',0,'« Non pas que » est une locution suivie du subjonctif.', 'Non pas que + subjonctif.', 'Non pas qu’il soit absent, mais il est occupé.'],
    ['Verbe irrégulier','Je ___ ce livre depuis hier.', 'lis','lirai','lise','lus',0,'Le présent de lire à « je » est « lis ».','Lire : je lis, nous lisons, ils lisent.','Je lis souvent le soir.'],
    ['Verbe irrégulier','Ils ___ venir, mais ils hésitent.', 'peuvent','puissent','pourront-ils que','pouvaient veniront',0,'Le présent de pouvoir à « ils » est « peuvent ».','Pouvoir : je peux, nous pouvons, ils peuvent.','Ils peuvent attendre.'],
    ['Futur antérieur','D’ici lundi, nous ___ le rapport.', 'aurons fini','finirons','avions fini','finissions',0,'Le rapport sera terminé avant lundi : futur antérieur.', 'D’ici + date future : futur antérieur fréquent.', 'D’ici ce soir, j’aurai répondu.'],
    ['Accord','Les problèmes qu’elle a ___ sont complexes.', 'résolus','résolu','résolues','résoudre',0,'« Problèmes » est masculin pluriel et COD avant le verbe.', 'Accord du participe avec avoir et COD antéposé.', 'Les exercices qu’ils ont résolus.'],
    ['Accord','La porte est restée ___.', 'ouverte','ouvert','ouverts','ouvrir',0,'Avec être, « restée » et l’attribut « ouverte » s’accordent avec porte.', 'Les participes employés avec être s’accordent.', 'Les fenêtres sont restées fermées.'],
    ['Conditionnel','Vous ___ me dire l’heure, s’il vous plaît ?', 'pourriez','pouvez','pourrez','pourriez-vous que',0,'Le conditionnel présent rend une demande plus polie.', 'Conditionnel de politesse.', 'Pourriez-vous répéter ?'],
    ['Subjonctif','Il est peu probable qu’ils ___ la date.', 'connaissent','connaissent-ils','connaîtront','connaissaient',0,'Une probabilité faible ou une appréciation subjective appelle le subjonctif.', 'Il est peu probable que + subjonctif.', 'Il est possible qu’elle vienne.'],
    ['Passé composé','Hier, nous ___ un excellent repas.', 'avons mangé','sommes mangés','mangions','avons manger',0,'« Manger » se conjugue avec avoir ; le participe est « mangé ».','Passé composé : auxiliaire + participe passé.', 'Ils ont choisi un dessert.'],
    ['Imparfait / passé composé','Tout à coup, elle ___ à rire.', 's’est mise','se mettait','se mettra','se serait mise',0,'« Tout à coup » introduit un événement ponctuel au passé composé.', 'Événement soudain : passé composé.', 'Soudain, il a crié.'],
    ['Futur','Dès que le train ___, nous monterons.', 'arrivera','arrive','arrivait','arriverait',0,'Dans cet exercice, « dès que » porte une valeur future et appelle le futur simple.', 'Dès que + futur simple quand l’action est future.', 'Dès qu’il reviendra, je partirai.'],
    ['Subjonctif','Je suis contente que vous ___ ce résultat.', 'ayez obtenu','avez obtenu','obtenez','aviez obtenu',0,'Le résultat est déjà obtenu : subjonctif passé.', 'Sentiment + que : subjonctif ; action antérieure : passé.', 'Je suis heureux qu’il soit venu.'],
    ['Pronominaux','Elles se sont ___ dans le miroir.', 'regardées','regardé','regarder','regardés',0,'Elles ont regardé elles-mêmes : « se » est COD, accord féminin pluriel.', 'Accord si le pronom est COD.', 'Ils se sont admirés.'],
    ['Pronominaux','Elle s’est ___ à ses parents.', 'adressée','adressé','adresser','adressés',0,'« S’adresser à quelqu’un » : ici le pronominal s’accorde avec le sujet dans cet emploi.', 'Les verbes essentiellement pronominaux s’accordent avec le sujet.', 'Elles se sont aperçues de l’erreur.'],
    ['Subjonctif','Encore que cette solution ___ coûteuse.', 'soit','est','sera','était',0,'« Encore que » est une locution concessive suivie du subjonctif.', 'Encore que + subjonctif.', 'Encore qu’il soit tard, continuons.'],
    ['Impératif','___-nous au courant dès votre arrivée.', 'Tenez','Tenez-vous','Tient','Tenons',0,'L’expression est « tenir quelqu’un au courant » ; à vous : tenez-nous.', 'Impératif avec pronom complément après le verbe.', 'Appelez-moi demain.'],
    ['Verbe irrégulier','Je ne crois pas qu’il ___ venir.', 'puisse','peut','pourra','pouvait',0,'Après « ne pas croire que », on utilise le subjonctif ; pouvoir → puisse.', 'Croire nié + subjonctif.', 'Je ne pense pas qu’elle puisse gagner.'],
    ['Temps','Au moment où je ___, il est entré.', 'dormais','ai dormi','dormirai','aurais dormi',0,'L’imparfait décrit l’action en cours au moment de l’entrée.', 'Action en cours : imparfait.', 'Pendant qu’elle écrivait, il est arrivé.'],
    ['Plus-que-parfait','Nous ___ déjà vu ce spectacle avant hier.', 'avions','avons','aurons','aurions',0,'« Avant hier » indique une antériorité par rapport à un passé : plus-que-parfait.', 'Plus-que-parfait = avoir/être imparfait + participe.', 'J’avais déjà entendu cette histoire.'],
    ['Conditionnel','Selon les prévisions, il ___ demain.', 'neigerait','neigera','neigeait','ait neigé',0,'Le conditionnel présente une prévision avec réserve.', 'Conditionnel de l’information non garantie.', 'La grève durerait deux jours.'],
    ['Subjonctif','Je préfère que tu ___ avec nous.', 'viennes','viens','viendras','venais',0,'« Préférer que » exprime une préférence : subjonctif.', 'Préférence + que : subjonctif.', 'Je préfère qu’il reste.'],
    ['Indicatif','Il est certain qu’elle ___ la vérité.', 'dit','dise','diraient','aurait dit',0,'Une certitude appelle l’indicatif.', 'Certitude + que : indicatif.', 'Il est évident qu’il a raison.'],
    ['Participe passé','Les candidates sont ___ à l’heure.', 'arrivées','arrivée','arrivés','arriver',0,'Avec être, accord féminin pluriel avec « candidates ».','Être + participe : accord avec le sujet.', 'Les étudiantes sont venues.'],
    ['Temps','En 2020, je ___ déjà depuis cinq ans dans cette entreprise.', 'travaillais','ai travaillé','travaillerai','aurais travaillé',0,'L’imparfait situe une durée en cours à un point du passé.', 'Imparfait pour une situation durable passée.', 'À cette date, nous vivions là depuis longtemps.'],
    ['Subjonctif','Que vous le ___ ou non, c’est vrai.', 'croyiez','croyez','croirez','croyiez-vous',0,'« Que... ou non » a ici une valeur concessive et demande le subjonctif.', 'Concession : subjonctif dans cette tournure.', 'Qu’il pleuve ou non, nous sortirons.'],
    ['Conditionnel','J’aurais voulu que tu me le ___.', 'dises','dis','diras','avais dit',0,'Après « aurais voulu que », le subjonctif exprime ce souhait non réalisé.', 'Vouloir que + subjonctif.', 'J’aurais aimé qu’elle reste.'],
    ['Participe passé','Les fleurs qu’il a ___ sont magnifiques.', 'offertes','offert','offerte','offerts',0,'« Fleurs » est COD féminin pluriel placé avant « a offert ».','Accord avec COD antéposé.', 'Les cadeaux qu’elle a reçus.'],
    ['Verbe irrégulier','Il faut que vous ___ plus souvent.', 'veniez','venez','viendrez','viendriez',0,'Le subjonctif de venir à « vous » est « veniez ».','Venir : que je vienne, que nous venions, que vous veniez.','Je souhaite qu’ils viennent.'],
    ['Temps composé','Après qu’elle ___, nous avons éteint les lumières.', 'est partie','soit partie','partait','partira',0,'« Après que » est suivi de l’indicatif ; l’action est passée.', 'Après que + indicatif, même dans un registre soigné.', 'Après qu’il est arrivé, nous avons commencé.'],
    ['Subjonctif','Il est temps que nous ___ une pause.', 'fassions','faisons','ferons','ferions',0,'« Il est temps que » se construit avec le subjonctif.', 'Il est temps que + subjonctif.', 'Il est temps que tu partes.'],
    ['Participe passé','Ils ont ___ les documents demandés.', 'envoyé','envoyés','envoyées','envoyer',0,'Le COD suit le verbe, donc « envoyé » reste invariable.', 'Avec avoir, pas d’accord si le COD suit.', 'Elle a acheté des livres.'],
    ['Futur proche','Attention, le vase ___.', 'va tomber','tombe','est tombé','tomberait',0,'Un événement imminent se formule au futur proche.', 'Aller au présent + infinitif = futur proche.', 'Le cours va commencer.'],
    ['Subjonctif','Je ne suis pas sûr qu’il ___ compris.', 'ait','a','avait','aurait',0,'Après une incertitude, le subjonctif passé indique une compréhension antérieure.', 'Être sûr négatif + subjonctif.', 'Je ne suis pas sûr qu’elle soit venue.']
  ];

  /* Paramètres et état de la session. TOTAL peut être modifié sans toucher à la banque. */
  const TOTAL = 20;
  let questions=[], index=0, points=0, answered=false;
  const $=id=>document.getElementById(id);
  /* Mélange immuable : les données source ne sont jamais modifiées. */
  const shuffle=a=>[...a].sort(()=>Math.random()-.5);

  /* Choisit 20 éléments différents : aucune répétition pendant une session. */
  /* Préférence de thème conservée localement, sans compte ni appel externe. */
  function setTheme(dark){document.body.classList.toggle('dark',dark);$('themeToggle').textContent=dark?'☀️':'🌙';$('themeToggle').setAttribute('aria-label',dark?'Activer le mode clair':'Activer le mode sombre');localStorage.setItem('verbes-b2-theme',dark?'dark':'light')}
  $('themeToggle').addEventListener('click',()=>setTheme(!document.body.classList.contains('dark')));
  setTheme(localStorage.getItem('verbes-b2-theme')==='dark');
  function start(){ questions=shuffle(bank).slice(0,TOTAL); index=0; points=0; answered=false; $('quiz').style.display='block'; $('result').className='result'; $('score').textContent=0; render(); }
  function render(){
    answered=false; const q=questions[index], area=$('question');
    $('counter').textContent=`Question ${index+1} sur ${TOTAL}`; $('progressText').textContent=`${Math.round(index/TOTAL*100)} %`; $('bar').style.width=`${index/TOTAL*100}%`;
    /* Les réponses sont remélangées à chaque affichage, tout en conservant la bonne réponse. */
    const raw=q.slice(2,6), correctIndex=q[6]; const mixed=shuffle(raw.map((text,i)=>({text,correct:i===correctIndex})));
    area.innerHTML=`<span class="tag">✦ ${q[0]}</span><h2>${q[1]}</h2><div class="answers">${mixed.map((o,i)=>`<button class="answer" data-correct="${o.correct}"><span>${String.fromCharCode(65+i)}.</span> ${o.text}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="next" id="next" disabled>${index===TOTAL-1?'Voir mes résultats':'Question suivante'} →</button></div>`;
    area.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>answer(b,q))); $('next').addEventListener('click',next);
  }
  /* Verrouille les choix, révèle la correction et rend le retour pédagogique visible. */
  function answer(button,q){
    if(answered)return; answered=true; const ok=button.dataset.correct==='true';
    document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.dataset.correct==='true')b.classList.add('correct')}); if(!ok)button.classList.add('wrong');
    if(ok){points++;$('score').textContent=points;playSound(true)}else playSound(false); const good=q[2+q[6]], f=$('feedback');
    f.innerHTML=`<strong>${ok?'✓ Bonne réponse !':'✕ À retenir'}</strong><p><b>Bonne réponse :</b> ${good}</p><p>${q[7]}</p><p class="rule">📘 <b>Règle :</b> ${q[8]}</p><p class="example">💬 Exemple : ${q[9]}</p>`; f.classList.add('show'); $('next').disabled=false;
  }
  function next(){ if(index<TOTAL-1){index++;render()}else showResult() }
  /* Le bilan final adapte automatiquement le badge et le conseil au résultat. */
  function showResult(){
    $('quiz').style.display='none'; const pct=Math.round(points/TOTAL*100); let level,advice,badge;
    if(pct>=90){level='Excellent';advice='Votre maîtrise des verbes B2 est très solide. Gardez ce rythme en vous entraînant avec des textes authentiques.';badge='🏆'}
    else if(pct>=75){level='Très bien';advice='Très bon niveau. Revoyez les quelques règles qui vous ont échappé, surtout les accords et les nuances du subjonctif.';badge='🌟'}
    else if(pct>=60){level='Bien';advice='Les bases sont bien installées. Travaillez régulièrement les temps composés et les déclencheurs du subjonctif.';badge='💪'}
    else{level='À renforcer';advice='Prenez le temps de reprendre les explications. Une courte révision quotidienne des temps et des accords fera vite la différence.';badge='🌱'}
    $('bar').style.width='100%';$('progressText').textContent='100 %'; $('result').innerHTML=`<div class="badge">${badge}</div><h2>${level} !</h2><div class="percent">${pct} %</div><p class="level">${points} bonne${points>1?'s':''} réponse${points>1?'s':''} sur ${TOTAL}</p><p class="advice">💡 ${advice}</p><div class="result-actions"><button class="share" id="share" type="button">📱 Partager mon score</button><button class="restart" id="restart">↻ Nouvel exercice</button></div>`;$('result').className='result show';$('restart').addEventListener('click',start);$('share').addEventListener('click',()=>shareScore(points,pct));if(pct>80)confetti();
  }
  /* Animation légère déclenchée uniquement au-dessus de 80 %. */
  function confetti(){ const colors=['#635bff','#f4a62a','#0fba8a','#ef5b7b','#64c7ff'];for(let i=0;i<58;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=colors[i%colors.length];e.style.setProperty('--drift',(Math.random()*180-90)+'px');e.style.animationDelay=Math.random()*.5+'s';document.body.append(e);setTimeout(()=>e.remove(),3100)} }
  /* Deux sons brefs créés avec Web Audio : aucun fichier ni service extérieur nécessaire. */
  function playSound(correct){try{const AudioCtx=window.AudioContext||window.webkitAudioContext,ctx=new AudioCtx(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=correct?'sine':'triangle';osc.frequency.setValueAtTime(correct?660:180,ctx.currentTime);if(correct)osc.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+.14);else osc.frequency.linearRampToValueAtTime(120,ctx.currentTime+.19);gain.gain.setValueAtTime(.08,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+(correct ? .22 : .28));osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+(correct ? .22 : .28));osc.addEventListener('ended',()=>ctx.close())}catch(e){/* Certains navigateurs peuvent bloquer le son : l'exercice reste fonctionnel. */}}
  /* Partage natif mobile, avec copie du texte comme solution de repli sur ordinateur. */
  async function shareScore(score,pct){const text=`J’ai obtenu ${score}/${TOTAL} (${pct} %) à l’Atelier des verbes B2 !`;try{if(navigator.share){await navigator.share({title:'Atelier des verbes B2',text});return}await navigator.clipboard.writeText(text);const b=$('share');b.textContent='✓ Score copié !';setTimeout(()=>b.textContent='📱 Partager mon score',1800)}catch(e){/* Annulation du partage ou presse-papiers indisponible : aucune action nécessaire. */}}
  start();
  </script>
